<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BK Card examples</title>
    <style>
        body {
            margin: 0
        }

        .sheet-outer {
            margin: 0;
        }

        .sheet-outer.A4 .sheet {
            width: 210mm;
            height: 296mm
        }

        .sheet.padding-5mm {
            padding: 5mm
        }

        .sheet {
           margin: 0;
           overflow: hidden;
           position: relative;
           box-sizing: border-box;
           page-break-after: always;
       }

        @media screen {
            body {
                background: #e0e0e0
            }

            .sheet {
                background: white;
                box-shadow: 0 .5mm 2mm rgba(0,0,0,.3);
                margin: 5mm auto;
            }
        }

        .container {
            display: grid;
            grid-template-rows: 1fr 1fr;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            height: 95%;
        }

        .box {
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            padding: 5px;
        }

        .card-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 0;
        }

        .person-photo-table {
            width: 100%;
            table-layout: fixed;
        }
        .person-identification  {
            width:60%;
            font-size: 20px;
        }
        .person-photo  {
            width:40%
        }
        .person-photo img {
            max-width:100%;
            max-height:100%;
        }
        .first-matches-table {
            width: 100%;
        }

        .pp-qr-table {
            width: 100%;
        }
        .sponsors-table {
            width: 100%;
            border-top: 1px solid black;
        }
        .my-qrcode {
            float: right;
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
</head>
<body>
    <div class="sheet-outer A4">
        <section class="sheet padding-5mm">
            <div class="container">
                <div class="box">
                    <h1 class="card-title">BK JEUGD NOV '24</h1>
                    <table class="person-photo-table">
                        <tr>
                            <td class="person-identification">
                                <div>Marie</div>
                                <div>Dekeyser</div>
                                <div>Pluimplukkers</div>
                            </td>
                            <td class="person-photo">
                                <img src="https://content.tournamentsoftware.com/images/profile/638D0B55-C39B-43AB-8A9D-D50D62017FBE/xlarge/0C539667-DBF0-4C8E-B124-DF7CF229D1E9.jpg?v=20200920104152"/>
                            </td>
                        </tr>
                    </table>
                    <table class="first-matches-table">
                        <tr>
                            <td>ME U17+U19</td>
                            <td>13:20:00</td>
                            <td>Julie Laporte</td>
                        </tr>
                        <tr>
                            <td>MD U17+U19</td>
                            <td>13:20:00</td>
                            <td>Julie Laporte <br>Amélie Moresmo</td>
                        </tr>
                    </table>

                    <table class="pp-qr-table">
                        <tr>
                            <td>
                                <img src="./pluimplukkersLogo.jpg"/>
                            </td>
                            <td style="text-align: right">
                                <div id="qrcode-1" class="my-qrcode"></div>
                            </td>
                            <script type="text/javascript">
                                new QRCode(document.getElementById("qrcode-1"), {
                                    text: "https://www.toernooi.nl/player-profile/0C539667-DBF0-4C8E-B124-DF7CF229D1E9",
                                    width: 128,
                                    height: 128,
                                    colorDark : "#000000",
                                    colorLight : "#ffffff",
                                    correctLevel : QRCode.CorrectLevel.H
                                });
                            </script>
                        </tr>
                    </table>
                    <table class="sponsors-table">
                        <tr>
                            <td><img src="./pluimplukkersLogo.jpg"/></td>
                            <td><img src="./pluimplukkersLogo.jpg"/></td>
                            <td><img src="./pluimplukkersLogo.jpg"/></td>
                        </tr>
                    </table>
                </div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>
        <section class="sheet padding-5mm">
            <div class="container">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
                <div class="box">4</div>
            </div>
        </section>
    </div>
</body>
</html>
